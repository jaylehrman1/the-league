<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The League \u2014 Revision History</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#1b1b1b;--mute:#6b6b6b;--accent:#c8102e;--line:#ecd9db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161212;--card:#201919;--ink:#f5eeee;--mute:#b3a3a3;--accent:#ff5a6e;--line:#3a2a2c}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
header{padding:24px 16px 14px;text-align:center;background:#c8102e;border-bottom:4px solid #8f0b21}
h1{margin:0;font-size:1.8rem;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.sub{color:#fff;opacity:.9;margin-top:6px;font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
main{max-width:720px;margin:0 auto;padding:16px 12px 40px}
.back{display:inline-block;background:var(--accent);color:var(--bg);font-family:system-ui,sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;border-radius:8px;padding:10px 18px}
.back.bottom{margin-top:18px}
h2{font-family:system-ui,sans-serif;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.rev{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:.9rem;line-height:1.45}
.empty{font-family:system-ui,sans-serif;color:var(--mute);margin-top:20px}
</style>
</head>
<body>
<header>
  <h1>The League</h1>
  <div class="sub">Revision History</div>
</header>
<main>
  <a class="back" href="./">&larr; Back to Rules</a>
  <div id="list"></div>
  <a class="back bottom" href="./">&larr; Back to Rules</a>
</main>
<script>document.write('<script src="rules.js?v='+Date.now()+'"><\/script>')</script>
<script>
(function(){
  var list=document.getElementById('list');
  if(typeof REVISIONS==='undefined'||!REVISIONS.length){var e=document.createElement('div');e.className='empty';e.textContent='No revisions yet.';list.appendChild(e);return}
  function fmt(d){var p=d.split('-');return p[1]+'-'+p[2]+'-'+p[0]}
  var last='';
  REVISIONS.forEach(function(x){
    if(x.date!==last){last=x.date;var h=document.createElement('h2');h.textContent=fmt(x.date);list.appendChild(h)}
    var c=document.createElement('div');c.className='rev';c.textContent=x.d;list.appendChild(c);
  });
})();
</script>
</body>
</html>
